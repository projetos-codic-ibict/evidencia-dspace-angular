<section class="rdapp-home-news-hero" role="banner" aria-label="Destaque principal">
  <div class="container rdapp-home-news-hero-container">
    <div class="row g-4 g-lg-5 align-items-center">
      <div class="col-12">
        <div class="rdapp-home-news-content text-center text-lg-start">
          <h1 class="rdapp-home-news-title" [attr.aria-label]="'evidencia.home.hero.aria-label' | translate">
            <span class="rdapp-home-news-title-tone-dark" [innerHTML]="'evidencia.home.hero.title-dark' | translate"></span>
            <span class="rdapp-home-news-title-tone-light" [innerHTML]="'evidencia.home.hero.title-light' | translate"></span>
          </h1>

          <p class="rdapp-home-news-description">
            {{ 'evidencia.home.hero.description' | translate }}
          </p>
          <a href="#" class="rdapp-home-news-como-usar">
            <i class="fas fa-play-circle"></i>
            {{ 'evidencia.home.hero.link' | translate }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
