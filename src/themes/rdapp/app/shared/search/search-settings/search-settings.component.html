<div
  ngbDropdown
  class="d-inline-block"
  display="dynamic"
  placement="bottom-end"
>
  <button
    class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold d-flex align-items-center gap-2 shadow-sm"
    id="searchSettingsDropdown"
    ngbDropdownToggle
  >
    <i class="fas fa-sliders-h" aria-hidden="true"></i>
    <span>{{ "search.sidebar.settings.title" | translate }}</span>
  </button>

  <div
    ngbDropdownMenu
    aria-labelledby="searchSettingsDropdown"
    class="settings-modal-wrapper shadow-lg p-0"
  >
    <div class="settings-modal-content">
      <h3>
        <i class="fas fa-cog text-primary" aria-hidden="true"></i>
        {{ "search.sidebar.settings.title" | translate }}
      </h3>

      <div class="setting-option result-order-settings">
        <h4>
          <label class="form-label" for="search-settings-sort">{{
            "search.sidebar.settings.sort-by" | translate
          }}</label>
        </h4>

        @if (sortOptionsList) {
          <select id="search-settings-sort" class="form-select w-100" (change)="reloadOrder($event)">
            @for (sortOptionsEntry of sortOptionsList; track sortOptionsEntry; let first = $first) {
              <option
                [value]="
                  sortOptionsEntry.field +
                  ',' +
                  sortOptionsEntry.direction.toString()
                "
                [selected]="
                  (currentSortOption &&
                    sortOptionsEntry.field === currentSortOption.field &&
                    sortOptionsEntry.direction ===
                      currentSortOption.direction) ||
                  (!currentSortOption && first)
                "
              >
                {{
                  "sorting." +
                    sortOptionsEntry.field +
                    "." +
                    sortOptionsEntry.direction | translate
                }}
              </option>
            }
          </select>
        }
      </div>

      <div class="setting-option page-size-settings">
        <ds-page-size-selector></ds-page-size-selector>
      </div>
    </div>
  </div>
</div>
