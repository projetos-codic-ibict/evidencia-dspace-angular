<form (ngSubmit)="onSubmit({ query: query, searchType: searchType })" action="/search">
  <div>
    <div class="mb-1 input-group">
      @if (showScopeSelector) {
        <button
          class="scope-button btn btn-outline-secondary text-truncate d-none d-lg-flex"
          [ngbTooltip]="dsoNameService.getName(selectedScope | async)"
          type="button"
          (click)="openScopeModal()"
          role="button"
          tabindex="0"
        >
          {{
            dsoNameService.getName(selectedScope | async) ||
              ("search.form.scope.all" | translate)
          }}
        </button>
      }
      <span class="input-group-text">
        <i class="fas fa-search" aria-hidden="true"></i>
      </span>
      <input
        type="text"
        [(ngModel)]="query"
        name="query"
        class="form-control"
        [attr.aria-label]="searchPlaceholder"
        [attr.data-test]="'search-box' | dsBrowserOnly"
        [placeholder]="searchPlaceholder"
        tabindex="0"
      />
      <div
        class="search-type-toggle search-type-toggle--inline d-none d-lg-flex"
        role="group"
        aria-label="Search type"
      >
        <ng-container
          *ngTemplateOutlet="searchTypeButtons; context: { dataTestSuffix: '' }"
        ></ng-container>
      </div>
      <button
        type="submit"
        class="search-button btn btn-{{ brandColor }}"
        [attr.data-test]="'search-button' | dsBrowserOnly"
        role="button"
        tabindex="0"
      >
        {{ "search.form.search" | translate }}
      </button>
    </div>
    <div class="search-type-row d-flex d-lg-none align-items-center">
      <div class="search-type-toggle" role="group" aria-label="Search type">
        <ng-container
          *ngTemplateOutlet="searchTypeButtons; context: { dataTestSuffix: '-mobile' }"
        ></ng-container>
      </div>
    </div>
    @if (showScopeSelector) {
      <div
        class="scope-pill-mobile d-flex d-lg-none align-items-center gap-2 mt-2 mb-3 ps-1"
      >
        <span class="text-muted small"
          >{{ "search.form.scope.searching-in" | translate }}:</span
        >
        <button
          type="button"
          class="scope-pill-mobile__btn"
          (click)="openScopeModal()"
          tabindex="0"
        >
          {{
            dsoNameService.getName(selectedScope | async) ||
              ("search.form.scope.all" | translate)
          }}
          <i class="fas fa-chevron-down ms-1" aria-hidden="true"></i>
        </button>
      </div>
    }
  </div>
</form>

<ng-template #searchTypeButtons let-dataTestSuffix="dataTestSuffix">
  <button
    type="button"
    class="search-type-toggle__btn"
    [class.active]="searchType === 'lexical'"
    [attr.title]="'search.form.search-type.lexical.hint' | translate"
    [attr.data-test]="('search-type-lexical' + dataTestSuffix) | dsBrowserOnly"
    (click)="searchType = 'lexical'"
  >
    {{ "search.form.search-type.lexical" | translate }}
  </button>
  @if (semanticSearchEnabled) {
    <button
      type="button"
      class="search-type-toggle__btn"
      [class.active]="searchType === 'semantic'"
      [attr.title]="'search.form.search-type.semantic.hint' | translate"
      [attr.data-test]="('search-type-semantic' + dataTestSuffix) | dsBrowserOnly"
      (click)="searchType = 'semantic'"
    >
      {{ "search.form.search-type.semantic" | translate }}
    </button>
  }
  @if (hybridSearchEnabled) {
    <button
      type="button"
      class="search-type-toggle__btn"
      [class.active]="searchType === 'hybrid'"
      [attr.title]="'search.form.search-type.hybrid.hint' | translate"
      [attr.data-test]="('search-type-hybrid' + dataTestSuffix) | dsBrowserOnly"
      (click)="searchType = 'hybrid'"
    >
      {{ "search.form.search-type.hybrid" | translate }}
    </button>
  }
</ng-template>
