<button
  type="button"
  class="scroll-to-top-btn"
  [class.visible]="visible"
  (click)="scrollToTop()"
  [attr.aria-label]="'evidencia.scroll-to-top.label' | translate"
  [attr.title]="'evidencia.scroll-to-top.label' | translate"
>
  <i class="fas fa-arrow-up" aria-hidden="true"></i>
  <span class="scroll-to-top-label">{{ 'evidencia.scroll-to-top.label' | translate }}</span>
</button>
